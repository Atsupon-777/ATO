<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Editless</title>
<!-- Home-screen app: manifest, icons (the header logo, enlarged) and an offline-only service worker. -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0a0a0b" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Editless" />
<script>
  // Only on the website: the app-store build bundles the page and has no use for it.
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor) {
    addEventListener("load", function () { navigator.serviceWorker.register("/sw.js"); });
  }
</script>
<script>
  // Theme before first paint: the saved choice, else the device setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem("editless-theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]'); if (t === "light" && m) m.content = "#f5f2eb";
  })();
</script>
<link id="reels-fonts" rel="stylesheet" href="/fonts/fonts.css" />
<style>
  :root {
    /* Night: ink-black ground so the videos are the color, warm ivory type, hairline champagne edges, one lime accent. */
    --bg: #070708; --panel: #111114; --panel2: #18181c; --line: #26252a; --ink: #f4f1ea; --mute: #9d9a92;
    --accent: #dfff4f; --accent-ink: #0a0a0b; --accent-text: #dfff4f; --accent-line: #dfff4f;
    --gold: #cbb68a; --glass: rgba(7,7,8,.82); --glass2: rgba(17,17,20,.88); --shadow: 0 24px 60px rgba(0,0,0,.55);
    --danger: #ff6b57; --ok: #6ee7a0; --radius: 18px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    /* Day: ivory paper, black ink buttons with lime type, champagne hairlines. */
    --bg: #f5f2eb; --panel: #fffdf8; --panel2: #ece7dc; --line: #ddd6c7; --ink: #15130f; --mute: #6e685c;
    --accent: #15130f; --accent-ink: #dfff4f; --accent-text: #4f5d00; --accent-line: #15130f;
    --gold: #a88a4e; --glass: rgba(245,242,235,.86); --glass2: rgba(255,253,248,.9); --shadow: 0 20px 50px rgba(60,48,20,.16);
    --danger: #c8402c; --ok: #1f8a52;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", system-ui, sans-serif; font-size: 14px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; }
  .top { display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); z-index: 10; }
  .logo { white-space: nowrap; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 18px; letter-spacing: .02em; cursor: pointer; }
  .logo span { color: var(--accent-text); }
  .nav { display: flex; gap: 4px; }
  .nav button { background: none; border: 0; padding: 8px 14px; border-radius: 999px; color: var(--mute); cursor: pointer; }
  .nav button.on { background: var(--panel2); color: var(--ink); }
  .spacer { flex: 1; }
  .pill { font-size: 12px; color: var(--mute); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 28px; font-weight: 900; margin: 0 0 6px; letter-spacing: .01em; }
  h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
  .sub { color: var(--mute); margin: 0 0 28px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); gap: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform .2s, border-color .2s; text-align: left; padding: 0; }
  .card:hover { transform: translateY(-3px); border-color: var(--accent-line); }
  .card .thumb { aspect-ratio: 9/16; background: #000; position: relative; }
  .card .body { padding: 16px 18px 18px; }
  .card .name { font-weight: 900; font-size: 17px; margin-bottom: 4px; }
  .card .desc { color: var(--mute); font-size: 13px; line-height: 1.6; }
  .tag { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--panel2); color: var(--accent-text); margin-bottom: 8px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 7px 12px; font-size: 12px; border-radius: 8px; }
  .form { max-width: 640px; display: grid; gap: 18px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; color: var(--mute); display: flex; justify-content: space-between; }
  .field input[type=text], .field textarea, .field select, .field input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  .field textarea { min-height: 72px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent-line); }
  .drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 18px; display: flex; gap: 14px; align-items: center; cursor: pointer; background: var(--panel); }
  .drop:hover, .drop.over { border-color: var(--accent-line); }
  .drop img, .drop video { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #000; }
  .drop .hint { color: var(--mute); font-size: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 14px; cursor: pointer; text-align: left; }
  .chip.on { border-color: var(--accent-line); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .chip small { display: block; color: var(--mute); font-size: 11px; margin-top: 2px; }
  .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .check small { color: var(--mute); display: block; }
  .hqopt { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin: 4px 0 10px; transition: border-color .2s, background .2s; }
  .hqopt.on { border-color: var(--accent-line); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  .hqopt input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
  .hqopt b { display: block; font-size: 14px; }
  .hqopt small { color: var(--mute); display: block; font-size: 12px; line-height: 1.5; margin-top: 3px; }
  .hqopt .tokcost { display: inline-block; margin-top: 0; color: var(--accent-text); white-space: nowrap; }
  .editor { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 32px; align-items: start; }
  .stage { position: sticky; top: 76px; }
  .player { border-radius: 16px; overflow: hidden; background: #000; position: relative; box-shadow: var(--shadow); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .panel h2 { display: flex; justify-content: space-between; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors label { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--mute); }
  .colors input { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
  .caplist { display: grid; gap: 6px; max-height: 520px; overflow: auto; padding-right: 4px; }
  .cap { display: grid; grid-template-columns: 54px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent; }
  .cap.now { border-color: var(--line); background: var(--panel2); }
  .cap.sel { border-color: var(--accent-line); }
  .cap.off input { text-decoration: line-through; opacity: .45; }
  .cap time { font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; cursor: pointer; }
  .cap input { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; width: 100%; }
  .cap input:hover, .cap input:focus { border-color: var(--line); background: var(--bg); outline: none; }
  .iconbtn { background: none; border: 1px solid var(--line); color: var(--mute); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 12px; }
  .iconbtn.on { color: var(--accent-text); border-color: var(--accent-line); }
  .dragzone { position: absolute; inset: 0; cursor: crosshair; }
  .handle { position: absolute; transform: translate(-50%, -50%); border: 2px dashed var(--accent-line); border-radius: 8px; padding: 4px 10px; color: var(--accent-text); font-size: 11px; background: rgba(0,0,0,.4); pointer-events: none; white-space: nowrap; }
  .bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #b8e62e, var(--accent)); border-radius: 99px; transition: width 1s linear; }
  .steps { display: grid; gap: 10px; margin: 18px 0; }
  .steps div { display: flex; gap: 10px; color: var(--mute); }
  .steps div.done { color: var(--ink); }
  .steps div.cur { color: var(--accent-text); }
  .err { color: var(--danger); white-space: pre-wrap; font-size: 13px; }
  .warn { color: #8a5a00; font-size: 12px; }
  .ok { color: var(--ok); }
  .cost { font-size: 12px; color: var(--mute); }
  .cost b { color: var(--ink); }
  .hist { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .hist .card .thumb { aspect-ratio: 4/5; background-size: cover; background-position: center; }
  .status { font-size: 11px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (max-width: 900px) {
    .grid3 { grid-template-columns: 1fr; }
    .editor { grid-template-columns: 1fr; }
    .stage { position: static; width: 100%; max-width: 360px; margin: 0 auto; }
    .grid2 { grid-template-columns: 1fr; }
    main { padding: 20px 16px 60px; }
  }

  /* ---- editor: pick the finish after generation ---- */
  .takes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .take { display: grid; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 12px; padding: 10px 12px; cursor: pointer; transition: border-color .2s, transform .2s; }
  .take small { color: var(--mute); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .take:hover { transform: translateY(-1px); }
  .take.on { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line) inset; }
  .take.more { border-style: dashed; }
  .lookopts { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
  .lookopt { flex: none; width: 92px; display: grid; gap: 6px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; font: inherit; font-size: 12px; text-align: center; scroll-snap-align: start; }
  .lookthumb { aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: #000; border: 2px solid var(--line); display: grid; place-items: center; color: var(--mute); transition: border-color .2s; }
  .lookthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lookthumb.auto { font-weight: 800; font-size: 20px; color: var(--accent-text); background: var(--panel2); }
  .lookopt.on .lookthumb { border-color: var(--accent-line); }
  .lookopt.on > span { color: var(--accent-text); font-weight: 700; }

  .cutstrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 4px; }
  .cutchip { flex: none; display: grid; gap: 2px; min-width: 96px; max-width: 120px; text-align: left; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 10px; padding: 8px 10px; cursor: pointer; font: inherit; }
  .cutchip b { font-size: 15px; }
  .cutchip small { color: var(--mute); font-size: 11px; }
  .cutchip span { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cutchip.on { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line) inset; }
  .cutchip.on span { color: var(--accent-text); }
  .cutline { font-size: 13px; color: var(--mute); margin: 4px 0 6px; }
  .cutrow { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cutlabel { font-size: 13px; color: var(--mute); }
  .cutlabel b { color: var(--ink); margin-left: 6px; }
  /* look builder: step tabs over live cards of the user's own footage */
  .buildsteps { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 10px 0 0; scrollbar-width: none; }
  .buildstep { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--mute); padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .buildstep small { font-size: 11px; opacity: .7; }
  .buildstep.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent-line); }
  .buildhint { color: var(--mute); font-size: 12px; margin: 10px 0 12px; }
  .livegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .livecard { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--panel); transition: border-color .2s, box-shadow .2s; }
  .livecard.on { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line) inset; }
  .livehead { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); }
  .livehead b { color: var(--accent-text); }
  .livethumb { border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; }
  .livename { display: grid; gap: 2px; min-height: 34px; }
  .livename b { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .liveswatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .livename small { color: var(--mute); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liveact { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .liveact .btn { padding: 7px 4px; }
  .liveact .btn:only-child { grid-column: 1 / -1; }
  .rangeends { display: flex; justify-content: space-between; color: var(--mute); font-size: 11px; }
  .buildsum { display: grid; gap: 6px; margin-top: 16px; }
  .buildsum button { display: grid; grid-template-columns: 80px 1fr auto; gap: 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; color: var(--ink); cursor: pointer; }
  .buildsum span { color: var(--mute); font-size: 12px; }
  .buildsum b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .buildsum small { color: var(--accent-text); font-size: 12px; }
  @media (max-width: 600px) { .livegrid { grid-template-columns: 1fr 1fr; } }
  .posopts { display: flex; gap: 10px; }
  .posopt { display: grid; gap: 6px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; font: inherit; font-size: 12px; text-align: center; }
  .posframe { position: relative; width: 54px; aspect-ratio: 9 / 16; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2); display: grid; place-items: center; }
  .posframe i { position: absolute; left: 18%; right: 18%; height: 12%; border-radius: 3px; background: var(--mute); }
  .posframe em { font-style: normal; font-weight: 800; color: var(--accent-text); }
  .posopt.on .posframe { border-color: var(--accent-line); }
  .posopt.on .posframe i { background: var(--accent); }
  .posopt.on > span { color: var(--accent-text); font-weight: 700; }
  details.fold { border-top: 1px solid var(--line); padding-top: 12px; }
  details.fold summary { cursor: pointer; font-size: 13px; color: var(--mute); }

  /* ---- sign-in, account, legal ---- */
  .signin { max-width: 400px; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 20px 40px; display: grid; gap: 12px; animation: pageIn .5s ease both; }
  .signin .logo { font-size: 20px; margin-bottom: 18px; }
  .signin h1 { font-size: 28px; line-height: 1.3; margin: 0; text-wrap: balance; word-break: auto-phrase; }
  .signin .sub { margin: 0 0 12px; }
  /* Sign-in with motion: real renders drift behind (desktop: right half; phone: a band above the form). */
  .signwrap { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; }
  .signwrap .signin { position: relative; z-index: 2; width: 100%; padding-top: max(40px, env(safe-area-inset-top)); }
  .signwrap .signin > * { animation: popIn .6s var(--ease) both; }
  .signwrap .signin > :nth-child(1) { animation-delay: .05s; } .signwrap .signin > :nth-child(2) { animation: none; }
  .signwrap .signin > :nth-child(3) { animation-delay: .55s; } .signwrap .signin > :nth-child(4) { animation-delay: .7s; }
  .signwrap .signin > :nth-child(5) { animation-delay: .8s; } .signwrap .signin > :nth-child(6) { animation-delay: .86s; }
  .signwrap .signin > :nth-child(n+7) { animation-delay: .92s; }
  .signin .logo .mark { display: inline-block; transform-origin: 20% 80%; animation: clap .9s var(--spring) .1s both; }
  @keyframes clap { 0% { opacity: 0; transform: rotate(-28deg) scale(.6); } 45% { opacity: 1; transform: rotate(8deg) scale(1.08); } 70% { transform: rotate(-3deg); } 100% { transform: none; } }
  .splith .w { display: inline-block; animation: wordIn .7s var(--ease) both; animation-delay: calc(.18s + var(--i) * .07s); }
  @keyframes wordIn { from { opacity: 0; transform: translateY(.6em) rotate(4deg); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .signsteps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: -4px 0 8px; font-size: 12px; color: var(--mute); }
  .signsteps span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); transition: background .35s, color .35s, border-color .35s, transform .35s var(--spring); }
  .signsteps b { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--panel2); font-size: 10px; font-family: "Plus Jakarta Sans", sans-serif; transition: background .35s; }
  .signsteps span.on { background: var(--accent); border-color: var(--accent-line); color: var(--accent-ink); transform: scale(1.06); font-weight: 700; }
  .signsteps span.on b { background: #fff; }
  .signstage { position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: #15140f; }
  .signstage .blob { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 1; mix-blend-mode: screen; }
  .signstage .b1 { background: radial-gradient(circle, #ffd23f 0%, transparent 60%); left: -20vmax; top: -15vmax; animation: drift1 14s ease-in-out infinite alternate; }
  .signstage .b2 { background: radial-gradient(circle, #ffb43f 0%, transparent 60%); right: -25vmax; bottom: -25vmax; animation: drift2 18s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vmax, 22vmax) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-16vmax, -18vmax) scale(.9); } }
  .signstage .cols { position: absolute; inset: -20% -10%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; transform: rotate(-10deg) scale(1.05); opacity: .5; }
  .signstage .col { display: grid; gap: 18px; align-content: start; animation: colUp 48s linear infinite; }
  .signstage .col.c1 { animation-direction: reverse; animation-duration: 56s; margin-top: -30%; }
  .signstage .col.c2 { animation-duration: 42s; margin-top: -12%; }
  .signstage .col img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 16px; display: block; background: #222; }
  @keyframes colUp { to { transform: translateY(-50%); } }
  .signstage .phone { position: absolute; z-index: 2; left: 50%; top: 50%; width: min(300px, 44%); aspect-ratio: 9 / 16; transform: translate(-50%, -50%); border-radius: 30px; border: 6px solid #0b0b08; outline: 1px solid rgba(255,255,255,.18); box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,210,63,.25), 0 0 80px rgba(255,210,63,.25); overflow: hidden; background: #000; animation: phoneIn 1s var(--spring) .3s both, float 6s ease-in-out 1.3s infinite; }
  .signstage .phone video { width: 100%; height: 100%; object-fit: cover; display: block; animation: fadeIn .5s ease both; }
  @keyframes phoneIn { from { opacity: 0; transform: translate(-50%, -30%) rotate(6deg) scale(.85); } to { opacity: 1; transform: translate(-50%, -50%); } }
  @keyframes float { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, calc(-50% - 10px)) rotate(-1deg); } }

  /* ---------- motion ---------- */
  :root { --spring: cubic-bezier(.2,.9,.25,1.15); --ease: cubic-bezier(.2,.8,.2,1); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes popOut { to { opacity: 0; transform: translateY(12px) scale(.97); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes slideDown { to { transform: translateY(100%); } }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes dice { from { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(1.3); } to { transform: rotate(360deg) scale(1); } }
  @keyframes flash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
  @keyframes pulse { 50% { opacity: .35; } }
  .page { animation: pageIn .38s var(--ease) backwards; }
  .tcard { animation: cardIn .5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
  .tthumb { background: linear-gradient(100deg, var(--panel) 30%, var(--panel2) 50%, var(--panel) 70%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
  .tthumb img { opacity: 0; transition: opacity .4s, transform .5s var(--ease); }
  .tthumb img.loaded { opacity: 1; }
  .tcard:hover .tthumb img { transform: scale(1.05); }
  .tcard:active .tthumb { transform: scale(.97); }
  .tplay { transition: transform .25s var(--spring), opacity .2s; }
  .tcard:hover .tplay { transform: scale(1.15); }
  .btn { transition: transform .15s var(--ease), filter .2s, background .2s, border-color .2s; position: relative; overflow: hidden; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:active:not(:disabled) { transform: scale(.96); }
  .btn:not(.ghost)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.4) 50%, transparent 65%); transform: translateX(-100%); pointer-events: none; }
  .btn:not(.ghost):hover:not(:disabled)::after { transform: translateX(100%); transition: transform .7s var(--ease); }
  .fchip { transition: background .25s, color .25s, border-color .25s, transform .15s; }
  .fchip:active { transform: scale(.95); }
  .sheet { animation: fadeIn .25s both; }
  .sheetbox { animation: popIn .38s var(--spring) both; transition: transform .3s var(--ease); }
  .sheet.closing { animation: fadeOut .22s both; }
  .sheet.closing .sheetbox { animation: popOut .22s both; }
  .grab { display: none; }
  .dice { display: inline-block; animation: dice .6s var(--spring); }
  .beatstyle { animation: flash .8s var(--ease); }
  .pill.save { transition: color .3s, border-color .3s; }
  .pill.save.busy { color: var(--accent-text); }
  .pill.save.busy::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: middle; animation: pulse 1s infinite; }
  .top .nav button { transition: color .2s, background .2s; }

  /* accordion panels in the editor */
  .panel > h2[role=button] { cursor: pointer; user-select: none; gap: 10px; }
  .panel > h2[role=button]::after { content: ''; width: 9px; height: 9px; border-right: 2px solid var(--mute); border-bottom: 2px solid var(--mute); transform: rotate(45deg); transition: transform .3s var(--ease); margin: 0 4px 4px auto; flex: none; }
  .panel > h2[role=button] > button { margin-left: auto; }
  .panel > h2[role=button] > button + * { margin-left: 0; }
  .panel.shut > h2[role=button]::after { transform: rotate(-45deg); margin-bottom: 0; }
  .panel.shut > :not(h2) { display: none; }
  .panel.shut > h2 { margin-bottom: 0; }

  /* breadcrumbs */
  .editor > div { min-width: 0; }
  .crumbs { min-width: 0; max-width: 100%; }
  .crumbs ol { list-style: none; display: flex; flex-wrap: nowrap; gap: 6px; padding: 0; margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .crumbs li { display: flex; align-items: center; gap: 6px; animation: fadeIn .4s both; }
  .crumbs li:nth-child(2) { animation-delay: .05s; } .crumbs li:nth-child(3) { animation-delay: .1s; } .crumbs li:nth-child(4) { animation-delay: .15s; }
  .crumbs li + li::before { content: '›'; opacity: .5; }
  .crumbs a { color: var(--mute); text-decoration: none; padding: 3px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); transition: color .2s, border-color .2s; }
  .crumbs a:hover { color: var(--ink); border-color: var(--accent-line); }
  .crumbs [aria-current] { color: var(--ink); font-weight: 700; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }

  /* FAQ accordion */
  .accordion { display: grid; gap: 8px; }
  .acc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; transition: border-color .25s; }
  .acc.open { border-color: var(--accent-line); }
  .acchead { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; border: 0; color: var(--ink); font: inherit; font-weight: 700; text-align: left; padding: 14px 16px; cursor: pointer; }
  .chev { width: 9px; height: 9px; border-right: 2px solid var(--mute); border-bottom: 2px solid var(--mute); transform: rotate(45deg); transition: transform .3s var(--ease); flex: none; }
  .acc.open .chev { transform: rotate(225deg); }
  .accbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
  .acc.open .accbody { grid-template-rows: 1fr; }
  .accbody > div { overflow: hidden; }
  .accbody p { margin: 0; padding: 0 16px 14px; color: var(--mute); line-height: 1.7; opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s var(--ease); }
  .acc.open .accbody p { opacity: 1; transform: none; }

  /* featured carousel */
  .carousel { position: relative; margin: 4px 0 18px; }
  .ctrack { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px calc(50% - 120px) 10px; overscroll-behavior-x: contain; }
  .ctrack::-webkit-scrollbar { display: none; }
  .cslide { flex: 0 0 240px; aspect-ratio: 9 / 16; scroll-snap-align: center; position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #000; padding: 0; cursor: pointer; color: var(--ink); text-align: left; transform: scale(.88); opacity: .55; transition: transform .45s var(--ease), opacity .45s, border-color .3s, box-shadow .45s; }
  .cslide.on { transform: none; opacity: 1; border-color: var(--accent-line); box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  .cslide img, .cslide video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ccap { position: absolute; inset: auto 0 0; padding: 40px 14px 14px; background: linear-gradient(transparent, rgba(0,0,0,.85)); display: grid; gap: 4px; transform: translateY(8px); opacity: 0; transition: transform .45s var(--ease) .1s, opacity .45s .1s; }
  .cslide.on .ccap { transform: none; opacity: 1; }
  .ccap b { font-size: 17px; }
  .ccap small { color: rgba(255,255,255,.75); font-size: 12px; line-height: 1.5; }
  .carr { position: absolute; top: calc(50% - 22px); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(22,22,26,.92); color: var(--ink); font-size: 24px; cursor: pointer; backdrop-filter: blur(8px); transition: transform .2s var(--spring), background .2s; }
  .carr:hover { transform: scale(1.08); background: var(--panel2); }

  .dots { display: flex; justify-content: center; gap: 6px; }

  /* Owner dashboard (#/admin) */

  /* ================= app-wide fit: no sideways drift, no zoom on focus, safe areas ================= */
  html { overflow-x: hidden; overscroll-behavior-x: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { overflow-x: clip; overscroll-behavior-x: none; min-height: 100dvh; }
  #root { overflow-x: clip; max-width: 100vw; }
  img, video, svg, canvas { max-width: 100%; }
  /* Page areas scroll up and down only; rows that scroll sideways do so inside themselves. */
  main, .top, .tabbar, .sheet { touch-action: pan-y; }
  .chipbar, .ctrack, .lookopts, .cutstrip, .buildsteps, .pickstrip, .plans, .crumbs ol, .admtable, .kindtabs { touch-action: pan-x pan-y; overscroll-behavior-x: contain; }
  @media (max-width: 900px) { main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
  /* iOS zooms into any field under 16px when it is focused, and the page then sits shifted sideways. */
  @media (pointer: coarse) { input, textarea, select, .searchbox input, .inp { font-size: 16px !important; } }

  /* ================= premium layer: type, depth, motion ================= */
  :root { --r-card: 16px; --hair: color-mix(in srgb, var(--ink) 9%, transparent); }
  h1, h2, .hero h1, .pickmeta b, .sheetinfo .name, .foldhead b, .uptile b, .herotile b { font-family: "Plus Jakarta Sans", "Noto Sans JP", system-ui, sans-serif; }
  h1 { font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  h2 { font-weight: 800; letter-spacing: -.01em; font-size: 17px; }
  .hero { margin: 4px 0 18px; }

  .hero .sub { margin: 0; font-size: 15px; }
  .top { border-bottom-color: var(--hair); }
  .langbtn { width: 40px; height: 40px; justify-content: center; padding: 0; border-color: var(--hair); }
  @media (min-width: 521px) { .langbtn:not(.themebtn) { width: auto; padding: 0 12px; } }
  .top.away { display: none; }
  .tsection { margin-bottom: 36px; }
  .thead { margin-bottom: 14px; }
  .thead h2 { font-size: 19px; }
  .btn { border-radius: 14px; letter-spacing: .01em; }
  .btn:not(.ghost):not(:disabled) { box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent), 0 1px 0 rgba(255,255,255,.25) inset; }
  :root[data-theme="light"] .btn:not(.ghost):not(:disabled) { box-shadow: 0 8px 22px rgba(21,19,15,.18); }
  .herotile { min-height: 180px; border-radius: 26px; }
  /* one card for every template: same frame, same poster treatment, same label */

  :root[data-theme="light"] .tthumb { box-shadow: 0 8px 22px rgba(60,48,20,.14); }
  .tthumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,.38)); box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; }
  .tplay { z-index: 3; width: 28px; height: 28px; background: rgba(10,10,11,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.18); }

  /* back button and breadcrumbs: every sub-page */

  /* My videos feed */
  .feedmedia { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

  /* pick flow: full screen, the take sized to the room left, the button always on screen */
  main.immersive { max-width: 520px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)) !important; }

  /* Tap-to-play previews: the still stays underneath, so starting, seeking or a cut never flashes black */
  .live { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .player .live, .livethumb .live { aspect-ratio: 9 / 16; height: auto; }

  .liveplay { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; border: 0; padding: 0; background: linear-gradient(rgba(0,0,0,0) 55%, rgba(0,0,0,.18)); cursor: pointer; color: #fff; -webkit-tap-highlight-color: transparent; }
  .liveplay .pvplay { width: 56px; height: 56px; transition: transform .15s var(--ease), background .2s; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .liveplay:hover .pvplay { background: rgba(10,10,11,.7); }

  .signstage .phone img { width: 100%; height: 100%; object-fit: cover; display: block; animation: fadeIn .5s ease both; }

  /* My videos: a card with room around it, details under it */
  .feeditem { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 0 16px; }
  .feedcard { height: 100%; width: fit-content; display: flex; flex-direction: column; justify-content: center; gap: 12px; }

  .feedinfo { flex: none; display: flex; align-items: center; gap: 10px; justify-content: space-between; width: 0; min-width: 100%; }

  :root[data-theme="light"] .boardbadge { background: #dfff4f; color: #15130f; }

  .boardopts { position: relative; flex: 1 1 auto; min-width: 0; }

  .boardq small { color: var(--mute); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .boardgrid { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; align-content: start; padding: 2px 2px 8px; scrollbar-width: none; -webkit-mask-image: linear-gradient(#000 calc(100% - 18px), transparent); mask-image: linear-gradient(#000 calc(100% - 18px), transparent); }
  .boardgrid::-webkit-scrollbar { display: none; }
  .ed { border: 0; padding: 0; background: none; color: var(--ink); cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }

  .tl { flex: 1 1 auto; min-height: 0; max-height: 400px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px 0 8px; overflow: hidden; }
