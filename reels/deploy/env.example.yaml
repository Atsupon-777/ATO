# Copy to deploy/env.yaml and fill in. These are not secret (secrets go in Secret Manager).
FIREBASE_PROJECT_ID: "your-project-id"
FIREBASE_API_KEY: "AIza..."
FIREBASE_AUTH_DOMAIN: "your-project-id.firebaseapp.com"
STRIPE_PRICE_STARTER: "price_..."
STRIPE_PRICE_STANDARD: "price_..."
STRIPE_PRICE_PRO: "price_..."
# "1" only after Stripe Tax shows an active Japan registration (Dashboard > Tax > Registrations)
STRIPE_TAX: "0"
# Pay as you go: PAYG_UNIT tokens cost PAYG_UNIT_YEN yen (tax included); customers buy PAYG_MIN..PAYG_MAX units.
# Charged inline at Checkout, so no Stripe price is needed and changing the price is an env change only.
PAYG_UNIT: "1000"
PAYG_UNIT_YEN: "200"
PAYG_MIN: "2"
PAYG_MAX: "500"
FREE_TOKENS: "10000"
# Your public address once a domain is mapped, e.g. https://app.example.com (used for Stripe return links)
PUBLIC_URL: ""
# iPhone / Android app (app/native/README.md). Public values; the webhook secret goes in Secret Manager
# as REVENUECAT_WEBHOOK_AUTH.
REVENUECAT_IOS_KEY: ""
REVENUECAT_ANDROID_KEY: ""
IAP_PRODUCT_TOPUP: "reels_tokens_10000"
IAP_TOPUP_TOKENS: "10000"
IAP_PRODUCT_STARTER: "reels_starter_monthly"
IAP_PRODUCT_STANDARD: "reels_standard_monthly"
IAP_PRODUCT_PRO: "reels_pro_monthly"
# "1" once an Apple Services ID is set up in Firebase, to show "Sign in with Apple" on the website too.
APPLE_SIGNIN_WEB: "0"
